<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login | Mini-SIEM</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <main class="auth-page">
            <header class="brand">
                <span class="brand-mark" aria-hidden="true">M</span>
                <span>Mini-SIEM</span>
            </header>

            <section class="auth-card" aria-labelledby="page-title">
                <p class="eyebrow">ACCOUNT ACCESS</p>
                <h1 id="page-title">Welcome back</h1>
                <p class="subtitle">Enter your account credentials to sign in.</p>

                <form id="form" method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text"
                               placeholder="Enter your username"
                               autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password"
                               placeholder="Enter your password"
                               autocomplete="current-password" required>
                    </div>

                    <button type="submit">Sign in</button>

                    <p class="form-footer">
                        Don't have an account?
                        <a href="{{ url_for('registration') }}">Create account</a>
                    </p>
                </form>
            </section>

            <p class="page-footer">Mini-SIEM · Log Analyzer</p>
        </main>
        {% include 'notifications.html' %}
    </body>
</html>
