<!DOCTYPE html>
<html>
    <head>
        <title>Log Analyzer Dashboard</title>
        <link rel="stylesheet" type="text/css" href="..\static\dashboard_style.css">  
    </head>
<body>
    <h1>Log Analyzer Dashboard</h1>
    <p>Welcome to the Log Analyzer Dashboard</p>
    <div class="row">
        <div class="d1">
            <div class="card">
                <h2>Total Logs</h2>
                <p>{{ total_logs }}</p>
            </div>
            <div class="card">
                <h2>Errors</h2>
                <p>{{ error_count }}</p>
            </div>
        </div>
        <div class="d2">
            <div class="card">
                <h2>Warnings</h2>
                <p>{{ warning_count }}</p>
            </div>
            <div class="card">
                <h2>Info</h2>
                <div id="live-logs"></div>
            </div>
        </div>
    </div>
    <script>
    async function fetchLogs() {
        const response = await fetch('/api/logs');
        const logs = await response.json();

        const logBox = document.getElementById('live-logs');

        logBox.innerHTML = '';

        logs.forEach(log => {
            const logEntry = document.createElement('p');

            logEntry.textContent =
                `${log.timestamp} | ${log.level} | ${log.ip_address} | ${log.message}`;

            logBox.appendChild(logEntry);
        });
    }

    fetchLogs();

    setInterval(fetchLogs, 2000);
</script>
</body>
</html>
